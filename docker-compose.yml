
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: usage_metering
      POSTGRES_USER: usage_app
      POSTGRES_PASSWORD: dev_password_123
    ports:
      - "5433:5432"
    volumes:
      - usage_metering_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usage_app -d usage_metering"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: usage_metering
      DB_USER: usage_app
      DB_PASSWORD: dev_password_123
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "dist/migrate.js"]
    restart: "no"

  app:
    build: .
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: usage_metering
      DB_USER: usage_app
      DB_PASSWORD: dev_password_123
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/db').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  demo:
    build: .
    environment:
      API_BASE_URL: http://app:3000
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
    depends_on:
      app:
        condition: service_healthy
    command: ["node", "dist/demo-client.js"]
    restart: "no"

volumes:
  usage_metering_data:
